# Triggered on every push to main.
#
# The deploy skill bumps the version locally before pushing, so this
# workflow only builds, publishes, and tags — no version bump in CI.
#
# 1. Builds the Mac (DMG) and Windows (NSIS) installers in parallel on
#    GitHub-hosted runners. Each build job ONLY produces installers — it
#    uploads them as workflow artifacts and never touches GitHub Releases.
# 2. A single `publish` job runs after BOTH builds succeed: it creates the
#    GitHub Release `v<version>` once, tags the released commit, and uploads
#    every installer plus latest.yml / latest-mac.yml. electron-updater
#    reads from that release for in-app updates.
#
# Publishing is isolated to one job on purpose. Previously each
# electron-builder run published directly, so the parallel Mac and Windows
# jobs raced to create the same release — the loser failed with HTTP 422
# "tag_name already_exists" and shipped a half release.
#
# Apple signing credentials are loaded at runtime from 1Password via the
# load-secrets-action.  The only GitHub secret needed is:
#   OP_SERVICE_ACCOUNT_TOKEN       1Password service account token
#
# GITHUB_TOKEN is provided automatically and used to create the release,
# upload its assets, and tag the commit.

name: Release

on:
  push:
    branches: [main]

# Serialize releases — never cancel an in-progress build.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Load Apple credentials from 1Password
        if: matrix.platform == 'mac'
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CSC_LINK: op://Conductor/Apple Developer/CERTIFICATE_P12
          CSC_KEY_PASSWORD: op://Conductor/Apple Developer/CERTIFICATE_PASSWORD
          APPLE_ID: op://Conductor/Apple Developer/APPLE_ID
          APPLE_APP_SPECIFIC_PASSWORD: op://Conductor/Apple Developer/APP_SPECIFIC_PASSWORD
          APPLE_TEAM_ID: op://Conductor/Apple Developer/APPLE_TEAM_ID

      - uses: actions/setup-go@v5
        with:
          go-version-file: conductord/go.mod
          cache-dependency-path: conductord/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build conductord binary
        # Explicit output name (no .exe) so the path matches what
        # electron-builder's extraResources expects on all platforms.
        working-directory: conductord
        shell: bash
        run: go build -o conductord .

      # ── macOS: build, sign, notarize — do NOT publish ─────────────────────
      # Apple credentials (CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, etc.) are
      # already exported by the 1Password step above. `--publish never` still
      # writes latest-mac.yml to dist/; only the upload to GitHub is skipped.
      - name: Build installer (macOS)
        if: matrix.platform == 'mac'
        run: |
          npx electron-vite build
          npx electron-builder --mac --publish never

      # ── Windows: build — do NOT publish ───────────────────────────────────
      - name: Build installer (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: |
          npx electron-vite build
          npx electron-builder --win --publish never

      # Hand the installers + update manifests to the publish job. Globs are
      # specific so builder-debug.yml / builder-effective-config.yaml stay
      # behind — only latest*.yml belongs on the release.
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest*.yml
          if-no-files-found: error

  # ── Publish + tag ───────────────────────────────────────────────────────
  # Runs once, only after BOTH platform builds succeed. Creating the release
  # from a single job — instead of from each electron-builder run — is what
  # removes the publish race.
  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"

          # Create the release + tag once. Idempotent: a re-run on the same
          # version reuses the existing release instead of failing.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — reusing it."
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "$version" \
              --notes "Release $tag"
          fi

          # Upload every installer + update manifest. --clobber overwrites
          # assets from an earlier attempt, so re-running the job is safe.
          gh release upload "$tag" artifacts/installer-*/* --clobber
